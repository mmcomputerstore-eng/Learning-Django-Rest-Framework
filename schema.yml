openapi: 3.0.3
info:
  title: Inventory Management API
  version: 1.0.0
  description: REST API for managing products and inventory.
paths:
  /api/products/:
    get:
      operationId: product_list
      description: List products and create a product.
      summary: List all products
      tags:
      - Products
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSerializers'
          description: ''
    post:
      operationId: product_create
      description: List products and create a product.
      summary: Create a product
      tags:
      - Products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSerializers'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductSerializers'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductSerializers'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSerializers'
          description: ''
        '400':
          description: No response body
  /api/products/{id}:
    get:
      operationId: products_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
